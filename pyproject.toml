[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "projectkoios-simulations"
version = "0.1.0.dev0"
description = "Simulation contracts and reusable simulation workflows for Project Koios"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]
dependencies = [
    "numpy>=2.3,<3",
    "projectkoios-physkit>=0.1.0",
]

[project.urls]
Repository = "https://github.com/eragasa/projectkoios-simulations"
Documentation = "https://github.com/eragasa/projectkoios-simulations/tree/main/docs"

[project.optional-dependencies]
development = [
    "build>=1.3,<2",
    "mypy>=2.3,<3",
    "numpy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
include = [
    "projectkoios.simulations",
    "projectkoios.simulations.*",
    "projectkoios.simulation_workflows",
    "projectkoios.simulation_workflows.*",
    "projectkoios.integrations",
    "projectkoios.integrations.*",
    "projectkoios.adapters",
    "projectkoios.adapters.*",
]
namespaces = true

[tool.setuptools.package-data]
"projectkoios.simulations" = ["py.typed"]
"projectkoios.simulation_workflows" = ["py.typed"]
"projectkoios.integrations" = ["py.typed"]
"projectkoios.integrations.wannier90" = ["provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "adversarial: malformed, unauthorized, or boundary-hostile cases",
    "integration: interaction between multiple components, files, or retained artifacts",
    "property: deterministic bounded property cases",
    "software_verification: bounded software-contract evidence without scientific validation",
    "smoke: quick check that a non-calculator entry point performs its basic operation",
    "validation: opt-in numerical, statistical, or scientific validation",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["projectkoios", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = [
    "src/python/projectkoios/simulations",
    "src/python/projectkoios/simulation_workflows",
    "src/python/projectkoios/integrations",
]
mypy_path = "src/python"
